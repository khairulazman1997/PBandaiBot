name: Check Premium Bandai SG - One Piece

on:
  schedule:
    # 04:00 UTC = 12:00 SGT (noon)
    - cron: "0 4 * * *"
    # 16:00 UTC = 00:00 SGT (midnight)
    - cron: "0 16 * * *"
  workflow_dispatch: {}   # lets you trigger a manual run from the Actions tab

permissions:
  contents: write   # required so git-auto-commit-action can push seen_items.json back

jobs:
  check:
    runs-on: ubuntu-latest
    # Without this, a hung step (e.g. apt-get stuck on a flaky mirror)
    # can run for GitHub's default 6-hour job timeout before failing.
    timeout-minutes: 15
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Use reliable apt mirror
        # GitHub's Azure-hosted runners sometimes point apt at
        # azure.archive.ubuntu.com, which can be flaky and cause
        # apt-get to hang retrying instead of failing fast. Point it at
        # the standard Ubuntu archive instead before installing anything.
        run: |
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list
          sudo apt-get update

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_MESSAGE_THREAD_ID: ${{ secrets.TELEGRAM_MESSAGE_THREAD_ID }}
          TELEGRAM_PRIVATE_CHAT_ID: ${{ secrets.TELEGRAM_PRIVATE_CHAT_ID }}
        run: python bot.py

      - name: Persist seen-items state
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update seen_items.json [skip ci]"
          file_pattern: seen_items.json